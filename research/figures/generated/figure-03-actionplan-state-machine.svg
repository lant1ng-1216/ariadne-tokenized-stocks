<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Figure 3 | ActionPlan state machine</title><desc id="desc">Explicit states and failure paths separating simulation, confirmation, signing and broadcast.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24313a}.title{font-size:24px;font-weight:600}.panel{font-size:18px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#60727c}.axis{stroke:#60727c;stroke-width:1.5}.hair{stroke:#a9b7bd;stroke-width:1}.arrow{fill:none;stroke:#60727c;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#60727c"/></marker></defs>
<text x="48" y="42" class="title">Figure 3 | ActionPlan state machine</text>
<text x="48" y="86" class="panel">(a) State transitions</text>
<rect x="100" y="180" width="190" height="70" rx="4" fill="#ffffff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="195.0" y="211" class="body" text-anchor="middle">draft</text>
<text x="195.0" y="236" class="small" text-anchor="middle">state</text>
<rect x="350" y="180" width="190" height="70" rx="4" fill="#ffffff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="445.0" y="211" class="body" text-anchor="middle">simulated</text>
<text x="445.0" y="236" class="small" text-anchor="middle">state</text>
<rect x="600" y="180" width="190" height="70" rx="4" fill="#ffffff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="695.0" y="211" class="body" text-anchor="middle">confirmed</text>
<text x="695.0" y="236" class="small" text-anchor="middle">state</text>
<rect x="850" y="180" width="190" height="70" rx="4" fill="#ffffff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="945.0" y="211" class="body" text-anchor="middle">signing_required</text>
<text x="945.0" y="236" class="small" text-anchor="middle">state</text>
<rect x="850" y="370" width="190" height="70" rx="4" fill="#ffffff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="945.0" y="401" class="body" text-anchor="middle">submitted</text>
<text x="945.0" y="426" class="small" text-anchor="middle">state</text>
<rect x="850" y="540" width="190" height="70" rx="4" fill="#ffffff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="945.0" y="571" class="body" text-anchor="middle">completed</text>
<text x="945.0" y="596" class="small" text-anchor="middle">state</text>
<path d="M290,215 L350,215" class="arrow"/>
<path d="M540,215 L600,215" class="arrow"/>
<path d="M790,215 L850,215" class="arrow"/>
<path d="M945,215 L945,370" class="arrow"/>
<path d="M945,405 L945,540" class="arrow"/>
<rect x="100" y="410" width="190" height="70" rx="4" fill="#fff0f0" stroke="#b64b4b" stroke-width="1.5"/>
<text x="195.0" y="441" class="body" text-anchor="middle">failed</text>
<text x="195.0" y="466" class="small" text-anchor="middle">unsafe or invalid</text>
<rect x="350" y="410" width="190" height="70" rx="4" fill="#fff6eb" stroke="#c97927" stroke-width="1.5"/>
<text x="445.0" y="441" class="body" text-anchor="middle">expired</text>
<text x="445.0" y="466" class="small" text-anchor="middle">deadline passed</text>
<path d="M195,250 L195,400" class="arrow"/>
<path d="M695,250 L445,400" class="arrow"/>
<path d="M945,250 L195,400" class="arrow"/>
<text x="48" y="640" class="small">A failed or expired plan cannot be broadcast without creating a new valid plan.</text>
