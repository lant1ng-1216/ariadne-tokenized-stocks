<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Figure 6 | Request observability trace</title><desc id="desc">A request trace showing fields used to classify retries and final outcomes.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24313a}.title{font-size:24px;font-weight:600}.panel{font-size:18px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#60727c}.axis{stroke:#60727c;stroke-width:1.5}.hair{stroke:#a9b7bd;stroke-width:1}.arrow{fill:none;stroke:#60727c;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#60727c"/></marker></defs>
<text x="48" y="42" class="title">Figure 6 | Request observability trace</text>
<text x="48" y="86" class="panel">(a) Read/prepare request trace</text>
<circle cx="110" cy="245" r="20" fill="#176b87"/><text x="110" y="300" class="body" text-anchor="middle">request</text>
<path d="M132,245 L278,245" class="arrow"/>
<circle cx="300" cy="245" r="20" fill="#176b87"/><text x="300" y="300" class="body" text-anchor="middle">attempt 0</text>
<path d="M322,245 L478,245" class="arrow"/>
<circle cx="500" cy="245" r="20" fill="#c97927"/><text x="500" y="300" class="body" text-anchor="middle">response</text>
<path d="M522,245 L678,245" class="arrow"/>
<circle cx="700" cy="245" r="20" fill="#c97927"/><text x="700" y="300" class="body" text-anchor="middle">classification</text>
<path d="M722,245 L878,245" class="arrow"/>
<circle cx="900" cy="245" r="20" fill="#c97927"/><text x="900" y="300" class="body" text-anchor="middle">retry/return</text>
<path d="M922,245 L1058,245" class="arrow"/>
<circle cx="1080" cy="245" r="20" fill="#176b87"/><text x="1080" y="300" class="body" text-anchor="middle">structured result</text>
<text x="48" y="390" class="panel">(b) Recorded fields</text>
<rect x="90" y="450" width="300" height="48" rx="4" fill="#fff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="240.0" y="481" class="body" text-anchor="middle">durationMs</text>
<text x="240.0" y="506" class="small" text-anchor="middle">latency of each attempt</text>
<rect x="450" y="450" width="300" height="48" rx="4" fill="#fff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="600.0" y="481" class="body" text-anchor="middle">attempt</text>
<text x="600.0" y="506" class="small" text-anchor="middle">retry count</text>
<rect x="810" y="450" width="300" height="48" rx="4" fill="#fff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="960.0" y="481" class="body" text-anchor="middle">status</text>
<text x="960.0" y="506" class="small" text-anchor="middle">HTTP response status</text>
<rect x="90" y="522" width="300" height="48" rx="4" fill="#fff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="240.0" y="553" class="body" text-anchor="middle">code</text>
<text x="240.0" y="578" class="small" text-anchor="middle">business response code</text>
<rect x="450" y="522" width="300" height="48" rx="4" fill="#fff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="600.0" y="553" class="body" text-anchor="middle">rateLimitHeaders</text>
<text x="600.0" y="578" class="small" text-anchor="middle">remaining quota</text>
<rect x="810" y="522" width="300" height="48" rx="4" fill="#fff" stroke="#a9b7bd" stroke-width="1.5"/>
<text x="960.0" y="553" class="body" text-anchor="middle">success</text>
<text x="960.0" y="578" class="small" text-anchor="middle">final client classification</text>
<text x="48" y="650" class="small">These fields support reproducible diagnosis without exposing credentials or private wallet material.</text>
</svg>